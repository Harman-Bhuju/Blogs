[project]
name = "blogs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harman-bhuju", email = "harmanbhuju@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
blogs = "blogs:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
]
